<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vở tiếng Anh: đọc hiểu, từ vựng và chuỗi ngày học</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@600;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <header class="top">
    <h1>Vở tiếng Anh</h1>
    <div class="user">
      <span class="streak" title="Số ngày học liên tiếp">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c.5 3.2-1.3 4.9-3 6.7C7.3 10.5 6 12.2 6 14.8A6 6 0 0 0 12 21a6 6 0 0 0 6-6.2c0-2-.9-3.6-2-4.8-.3 1.2-1 2-1.9 2.4.5-3.7-.6-7.6-2.1-10.4z"/></svg>
        <b id="streak-count">0</b><span class="sr"> ngày học liên tiếp</span>
      </span>
      <span id="user-name"></span>
      <span class="badge" id="user-role" hidden>Quản trị</span>
      <button class="link" data-act="logout">Đăng xuất</button>
    </div>
  </header>

 <nav class="tabs" role="tablist" aria-label="Chức năng">
    <button role="tab" data-act="tab" data-tab="reading">Đọc hiểu</button>
    <button role="tab" data-act="tab" data-tab="vocab">Từ vựng</button>
    <button role="tab" data-act="tab" data-tab="grammar">Ngữ pháp</button> <!-- THÊM DÒNG NÀY -->
    <button role="tab" data-act="tab" data-tab="quiz">Làm quiz</button>
    <button role="tab" data-act="tab" data-tab="streak">Chuỗi ngày</button>
  </nav>

  <main id="view" role="tabpanel" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="mock-data.js"></script>
  <script src="mock-api.js"></script>
  <script src="mock-auth.js"></script>
  <script src="mock-content.js"></script>
  <script src="core.js"></script>
  <script src="reading.js"></script>
  <script src="vocab.js"></script>
  <script src="quiz.js"></script>
  <script src="streak.js"></script>
  <script src="app.js"></script>
  
  <script src="grammar-data.js"></script> <!-- Dữ liệu bài tập -->
  <script src="grammar.js"></script>      <!-- Xử lý giao diện & logic dịch câu -->
  <script src="app.js"></script>
</body>
</html>
